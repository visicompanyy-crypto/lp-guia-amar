<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>guia de compras · amar casa criativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=garet@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body {
    background: var(--acc-ink);
    color: var(--acc-bone);
    overflow-x: hidden;
  }

  /* ——————— layout primitives ——————— */
  .container { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .container { padding: 0 20px; } }

  /* shared chrome strip used everywhere */
  .strip-handles {
    background: var(--acc-petrol);
    color: var(--acc-bone);
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    align-items: center;
    padding: 14px 28px;
    font-family: var(--font-sans);
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: lowercase;
  }
  .strip-handles svg { width: 28px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.4; }

  .strip-words {
    background: var(--acc-petrol);
    color: var(--acc-bone);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 18px 32px;
    font-family: var(--font-sans);
    font-size: 13px;
    letter-spacing: .42em;
    text-transform: lowercase;
  }
  .strip-words > span:nth-child(2) { text-align: center; }
  .strip-words > span:nth-child(3) { text-align: right; }
  .strip-words--bone { background: var(--acc-bone-soft); color: var(--acc-petrol); }

  /* —————————————————— HERO —————————————————— */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex; flex-direction: column;
    background: var(--acc-petrol-dk);
  }
  .hero__art {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .hero__video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 0;
    opacity: .55;
  }
  .hero__art::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(180,95,61,.18), transparent 65%),
      radial-gradient(ellipse at 80% 80%, rgba(47,69,80,.6), transparent 55%);
    z-index: 1;
  }
  .hero__art::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(26,26,26,.4) 100%);
    z-index: 2;
  }
  .hero__inner {
    position: relative; z-index: 3;
    text-align: center;
    padding: 120px 32px;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }
  .hero__eyebrow {
    font-family: var(--font-sans);
    font-size: 12px;
    letter-spacing: .42em;
    text-transform: lowercase;
    opacity: .85;
    margin-bottom: 32px;
  }
  .hero__title {
    font-family: var(--font-sans);
    font-weight: 700;
    color: var(--acc-bone);
    font-size: clamp(48px, 8vw, 110px);
    line-height: .82;
    letter-spacing: -.02em;
    margin: 0;
    text-shadow: 0 4px 40px rgba(0,0,0,.35);
  }
  .hero__divider {
    width: 200px; height: 1px;
    background: var(--acc-bone);
    opacity: .5;
    margin: 32px auto;
  }
  .hero__tag {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    max-width: 380px;
    margin: 0 auto;
    font-family: var(--font-sans);
    font-size: 13px;
    letter-spacing: .42em;
    text-transform: lowercase;
    opacity: .9;
  }
  .hero__tag > span:nth-child(2) { text-align: center; }
  .hero__tag > span:nth-child(3) { text-align: right; }

  .hero__sub {
    margin: 64px auto 0;
    max-width: 620px;
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: clamp(18px, 1.6vw, 22px);
    line-height: 1.5;
    color: var(--acc-bone);
    opacity: .9;
  }
  .hero__cta { margin-top: 40px; display: inline-flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

  /* scroll indicator */
  .hero__scroll {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 4;
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .3em; text-transform: lowercase; opacity: .7;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .hero__scroll::after {
    content: ""; width: 1px; height: 32px;
    background: linear-gradient(180deg, var(--acc-bone), transparent);
    animation: scrollDown 2s ease-in-out infinite;
  }
  @keyframes scrollDown {
    0%,100% { transform: scaleY(.4); transform-origin: top; }
    50% { transform: scaleY(1); transform-origin: top; }
  }

  /* —————————————————— BASTIDORES —————————————————— */
  .basti {
    background: var(--acc-bone);
    color: var(--acc-ink);
    padding: 0;
  }
  .basti__inner {
    max-width: 880px;
    margin: 0 auto;
    padding: 120px 32px;
  }
  .basti__eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: lowercase;
    opacity: .55;
    margin-bottom: 32px;
  }
  .basti__title {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(40px, 5.5vw, 72px);
    line-height: 1.05;
    letter-spacing: -.02em;
    margin: 0 0 48px;
    max-width: 16ch;
  }
  .basti__title em { font-style: italic; color: var(--acc-terra); font-variation-settings: "WONK" 1; }
  .basti__body {
    font-size: 17px;
    line-height: 1.7;
    max-width: 640px;
    color: var(--acc-ink);
  }
  .basti__body p + p { margin-top: 1.2em; }
  .basti__body strong { font-weight: 600; }
  .basti__sig {
    display: inline-block;
    margin-top: 56px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 32px;
    color: var(--acc-petrol);
    font-variation-settings: "WONK" 1;
  }

  /* —————————————————— STATS —————————————————— */
  .stats {
    background: var(--acc-bone);
    color: var(--acc-ink);
    padding: 0 0 120px;
  }
  .stats__grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 32px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-top: 1px solid rgba(26,26,26,.15);
  }
  .stat {
    padding: 48px 24px;
    border-right: 1px solid rgba(26,26,26,.15);
  }
  .stat:last-child { border-right: none; }
  .stat__num {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -.03em;
    color: var(--acc-terra);
  }
  .stat__num em { font-style: italic; }
  .stat__lbl {
    margin-top: 12px;
    font-family: var(--font-sans);
    font-size: 13px;
    letter-spacing: .15em;
    text-transform: lowercase;
    opacity: .65;
    line-height: 1.4;
  }
  @media (max-width: 720px) {
    .stats__grid { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(2) { border-right: none; }
    .stat:nth-child(1), .stat:nth-child(2) { border-bottom: 1px solid rgba(26,26,26,.15); }
  }

  /* —————————————————— PARA QUEM —————————————————— */
  .forwhom {
    background: var(--acc-ink);
    color: var(--acc-bone);
    padding: 140px 0;
  }
  .forwhom__head {
    max-width: 1100px;
    margin: 0 auto 80px;
    padding: 0 32px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: end;
  }
  .forwhom__title {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(48px, 6vw, 88px);
    line-height: .95;
    letter-spacing: -.02em;
    margin: 0;
  }
  .forwhom__title em { font-style: italic; color: var(--acc-terra); }
  .forwhom__lead {
    font-size: 17px;
    line-height: 1.6;
    opacity: .8;
    max-width: 420px;
    margin: 0 0 0 auto;
  }
  .forwhom__list {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 32px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
    border-top: 1px solid var(--acc-line);
  }
  .fw {
    padding: 40px 0;
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 24px;
    border-bottom: 1px solid var(--acc-line);
    align-items: start;
  }
  .fw:nth-child(odd) { padding-right: 32px; border-right: 1px solid var(--acc-line); }
  .fw:nth-child(even) { padding-left: 32px; }
  .fw__num {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .25em;
    opacity: .55;
    padding-top: 6px;
  }
  .fw__txt {
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: 22px;
    line-height: 1.4;
    letter-spacing: -.005em;
  }
  .fw__txt em { font-family: var(--font-display); font-style: italic; color: var(--acc-terra); font-weight: 400; }
  @media (max-width: 720px) {
    .forwhom__head { grid-template-columns: 1fr; }
    .forwhom__lead { margin: 0; }
    .forwhom__list { grid-template-columns: 1fr; }
    .fw:nth-child(odd) { padding-right: 0; border-right: none; }
    .fw:nth-child(even) { padding-left: 0; }
  }

  /* —————————————————— CATEGORIAS (sumário) —————————————————— */
  .cats {
    background: var(--acc-petrol-dk);
    color: var(--acc-bone);
    padding: 140px 0;
    position: relative;
  }
  .cats__head {
    max-width: 1100px; margin: 0 auto 64px; padding: 0 32px;
  }
  .cats__eye {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .3em;
    opacity: .6;
    margin-bottom: 24px;
    text-transform: lowercase;
  }
  .cats__title {
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: clamp(56px, 9vw, 140px);
    letter-spacing: .02em;
    line-height: .9;
    text-transform: lowercase;
    margin: 0;
  }
  .cats__lead {
    margin-top: 32px;
    font-size: 17px;
    line-height: 1.6;
    opacity: .85;
    max-width: 600px;
  }

  .cats__grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 32px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    border-top: 1px solid var(--acc-line);
  }
  .cat {
    padding: 28px 0;
    border-bottom: 1px solid var(--acc-line);
    display: grid;
    grid-template-columns: 56px 1fr auto 64px;
    gap: 20px;
    align-items: center;
    position: relative;
    padding-right: 24px;
  }
  .cat:not(:nth-child(3n)) { border-right: 1px solid var(--acc-line); padding-right: 24px; }
  .cat:not(:nth-child(3n)) ~ .cat { padding-left: 24px; }
  .cat__num {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .15em;
    color: var(--acc-terra);
    opacity: .9;
  }
  .cat__name {
    font-family: var(--font-sans);
    font-weight: 300;
    font-size: 22px;
    letter-spacing: .02em;
    text-transform: lowercase;
  }
  .cat__count {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .15em;
    opacity: .55;
  }
  .cat__thumb {
    width: 64px;
    height: 64px;
    object-fit: cover;
    object-position: top center;
    border-radius: 2px;
    opacity: .85;
    flex-shrink: 0;
  }
  .cat__thumb-empty {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
  }
  @media (max-width: 900px) {
    .cats__grid { grid-template-columns: repeat(2, 1fr); }
    .cat:not(:nth-child(3n)) { border-right: none; padding-right: 0; }
    .cat:nth-child(odd) { border-right: 1px solid var(--acc-line); padding-right: 20px; }
    .cat:nth-child(even) { padding-left: 20px; }
  }
  @media (max-width: 600px) {
    .cats__grid { grid-template-columns: 1fr; }
    .cat { border-right: none !important; padding-right: 0 !important; padding-left: 0 !important; }
  }

  /* —————————————————— PRÉVIA SPREAD —————————————————— */
  .preview {
    background: var(--acc-ink);
    padding: 140px 0;
  }
  .preview__head {
    max-width: 1100px; margin: 0 auto 80px; padding: 0 32px;
    text-align: center;
  }
  .preview__eye {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .3em; opacity: .55; margin-bottom: 16px;
    text-transform: lowercase;
  }
  .preview__title {
    font-family: var(--font-display); font-weight: 300;
    font-size: clamp(40px, 5vw, 64px); line-height: 1.05;
    letter-spacing: -.02em; margin: 0;
  }
  .preview__title em { font-style: italic; color: var(--acc-terra); font-variation-settings: "WONK" 1; }

  .preview__rail {
    display: flex;
    gap: 24px;
    overflow-x: auto;
    padding: 0 32px 32px;
    scroll-snap-type: x mandatory;
    scrollbar-color: var(--acc-petrol) transparent;
  }
  .preview__rail::-webkit-scrollbar { height: 6px; }
  .preview__rail::-webkit-scrollbar-track { background: transparent; }
  .preview__rail::-webkit-scrollbar-thumb { background: var(--acc-petrol); border-radius: 4px; }

  .spread {
    flex: 0 0 auto;
    width: 320px;
    aspect-ratio: 357/639;
    background: var(--acc-bone);
    border-radius: 4px;
    overflow: hidden;
    scroll-snap-align: center;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.7);
    position: relative;
  }
  .spread img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .spread__cap {
    position: absolute; bottom: 16px; left: 16px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .25em;
    text-transform: lowercase;
    color: var(--acc-bone);
    background: rgba(26,26,26,.7);
    padding: 6px 10px;
    border-radius: 2px;
    backdrop-filter: blur(8px);
  }

  /* —————————————————— ATUALIZAÇÕES —————————————————— */
  .updates {
    background: var(--acc-bone);
    color: var(--acc-ink);
    padding: 140px 0;
  }
  .updates__inner {
    max-width: 1100px; margin: 0 auto; padding: 0 32px;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 80px;
    align-items: center;
  }
  .updates__eye {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .3em; opacity: .55; margin-bottom: 24px;
    text-transform: lowercase;
  }
  .updates__title {
    font-family: var(--font-display); font-weight: 300;
    font-size: clamp(44px, 5vw, 72px); line-height: 1; letter-spacing: -.02em;
    margin: 0 0 32px;
  }
  .updates__title em { font-style: italic; color: var(--acc-terra); font-variation-settings: "WONK" 1; }
  .updates__body { font-size: 17px; line-height: 1.65; max-width: 480px; }
  .updates__body p + p { margin-top: 1em; }

  .calendar {
    background: var(--acc-petrol);
    color: var(--acc-bone);
    padding: 40px;
    border-radius: 4px;
    aspect-ratio: 4/4.4;
  }
  .cal__head {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid rgba(237,231,218,.2);
    padding-bottom: 16px;
    margin-bottom: 24px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: lowercase;
  }
  .cal__head em { font-family: var(--font-display); font-size: 22px; font-style: italic; letter-spacing: -.01em; color: var(--acc-bone); }
  .cal__rows { display: flex; flex-direction: column; gap: 16px; }
  .cal__row {
    display: grid; grid-template-columns: 60px 1fr auto;
    gap: 16px; padding-bottom: 14px;
    border-bottom: 1px solid rgba(237,231,218,.15);
    align-items: baseline;
  }
  .cal__date { font-family: var(--font-mono); font-size: 11px; letter-spacing: .15em; opacity: .85; }
  .cal__lbl { font-family: var(--font-sans); font-size: 14px; letter-spacing: .02em; }
  .cal__count { font-family: var(--font-mono); font-size: 11px; opacity: .65; letter-spacing: .1em; }
  .cal__row--new .cal__lbl::before {
    content: "•";
    color: var(--acc-terra);
    margin-right: 8px;
  }
  @media (max-width: 800px) {
    .updates__inner { grid-template-columns: 1fr; gap: 48px; }
  }

  /* —————————————————— FERNANDA / VIDEO ————————————————— */
  .fernanda {
    background: var(--acc-bone);
    color: var(--acc-ink);
    padding: 140px 0;
  }
  .fernanda__inner {
    max-width: 1100px; margin: 0 auto; padding: 0 32px;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 80px;
    align-items: center;
  }
  .fernanda__eye {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .3em; opacity: .55;
    text-transform: lowercase; margin-bottom: 24px;
  }
  .fernanda__title {
    font-family: var(--font-display); font-weight: 300;
    font-size: clamp(40px, 5vw, 68px); line-height: 1; letter-spacing: -.02em;
    margin: 0 0 32px; max-width: 12ch;
  }
  .fernanda__title em { font-style: italic; color: var(--acc-terra); font-variation-settings: "WONK" 1; }
  .fernanda__quote {
    font-family: var(--font-sans); font-weight: 300;
    font-size: 18px; line-height: 1.6;
    max-width: 480px; margin: 0 0 32px;
  }
  .fernanda__by {
    display: inline-flex; align-items: center; gap: 12px;
    text-decoration: none; color: var(--acc-petrol);
    font-family: var(--font-mono); font-size: 12px;
    letter-spacing: .25em; text-transform: lowercase;
    border-bottom: 1px solid currentColor; padding-bottom: 4px;
    transition: color .25s var(--ease);
  }
  .fernanda__by:hover { color: var(--acc-terra); }
  .fernanda__by strong { font-weight: 600; }
  .fernanda__video {
    aspect-ratio: 9/16;
    background: var(--acc-ink);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.45);
    position: relative;
  }
  .fernanda__video video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .fernanda__plate {
    position: absolute; bottom: 16px; left: 16px;
    background: rgba(26,26,26,.7); backdrop-filter: blur(8px);
    color: var(--acc-bone);
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .25em; text-transform: lowercase;
    padding: 6px 10px; border-radius: 2px;
  }
  @media (max-width: 800px) {
    .fernanda__inner { grid-template-columns: 1fr; gap: 48px; }
    .fernanda__video { max-width: 320px; margin: 0 auto; width: 100%; }
  }

  /* —————————————————— DEPOIMENTOS ————————————————— */
  .voices {
    background: var(--acc-ink);
    padding: 140px 0;
  }
  .voices__head {
    max-width: 1100px; margin: 0 auto 64px; padding: 0 32px;
    display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: end;
  }
  .voices__eye {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .3em; opacity: .55; text-transform: lowercase;
  }
  .voices__title {
    font-family: var(--font-display); font-weight: 300;
    font-size: clamp(40px, 4.5vw, 64px); line-height: 1; letter-spacing: -.02em;
    margin: 0;
  }
  .voices__title em { font-style: italic; color: var(--acc-terra); font-variation-settings: "WONK" 1; }
  .voices__grid {
    max-width: 1100px; margin: 0 auto; padding: 0 32px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px;
  }
  .quote {
    background: var(--acc-ink-soft);
    padding: 40px;
    border: 1px solid var(--acc-line);
    display: flex; flex-direction: column; gap: 24px;
    min-height: 320px;
  }
  .quote__mark {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 64px;

/* ——— cta strip ——— */
const CtaStrip = ({ tweaks, variant = "dark", sub = "acesso imediato · 7 dias de garantia" }) => (
  <div className={`cta-strip cta-strip--${variant}`}>
    <a href={EDUZZ_URL} target="_blank" rel="noopener" className="btn btn--solid">{tweaks.ctaLabel}</a>
    <span className="cta-strip__sub">{sub}</span>
  </div>
);

/* ——— tweaks panel ——— */
const Panel = ({ tweaks, setTweak }) => {
  const T = window.TweaksPanel; const S = window.TweakSection;
  const R = window.TweakRadio; const Tg = window.TweakToggle; const Tx = window.TweakText;
  if (!T) return null;
  return (
    <T title="tweaks">
      <S title="paleta">
        <R label="cor de acento"
           value={tweaks.palette}
           onChange={(v)=>setTweak("palette", v)}
           options={[
             {value:"terra", label:"terra"},
             {value:"petrol", label:"petrol"},
             {value:"mono", label:"mono"},
           ]} />
      </S>
      <S title="hero">
        <R label="layout"
           value={tweaks.hero}
           onChange={(v)=>setTweak("hero", v)}
           options={[
             {value:"centered", label:"centered"},
             {value:"split", label:"split"},
             {value:"editorial", label:"editorial"},
           ]} />
      </S>
      <S title="copy do cta">
        <Tx label="texto do botão" value={tweaks.ctaLabel} onChange={(v)=>setTweak("ctaLabel", v)} />
      </S>
      <S title="seções">
        <Tg label="mostrar números (stats)" value={tweaks.showStats} onChange={(v)=>setTweak("showStats", v)} />
        <Tg label="mostrar depoimentos" value={tweaks.showVoices} onChange={(v)=>setTweak("showVoices", v)} />
        <Tg label="mostrar calendário de updates" value={tweaks.showCalendar} onChange={(v)=>setTweak("showCalendar", v)} />
      </S>
    </T>
  );
};

/* ——— app ——— */
const App = () => {
  const useTw = window.useTweaks;
  const [tweaks, setTweak] = useTw ? useTw(TWEAK_DEFAULTS) : [TWEAK_DEFAULTS, ()=>{}];

  useEffect(() => {
    document.body.dataset.palette = tweaks.palette;
    document.body.dataset.hero = tweaks.hero;
  }, [tweaks.palette, tweaks.hero]);

  return (
    <>
      <Hero tweaks={tweaks} />
      {tweaks.showStats && <Stats />}
      <ForWhom tweaks={tweaks} />
      <Categories />
      <Preview tweaks={tweaks} />
      {tweaks.showCalendar && <Updates />}
      {tweaks.showVoices && <Voices />}
      <VideoDepo />
      <Offer tweaks={tweaks} />
      <Faq />
      <Footer />
      <Panel tweaks={tweaks} setTweak={setTweak} />
    </>
  );
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
